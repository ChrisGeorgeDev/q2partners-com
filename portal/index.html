  const totalInterest   = INVESTOR.loans.reduce((s,l)=>s+l.interest,0);

      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
        {[
          { l:"Total Principal Lent",    v:fc(totalPrincipal,true),   c:T.text,      sub:`${INVESTOR.loans.length} loan positions` },
          { l:"Outstanding Balance",     v:fc(totalOutstanding,true), c:T.amber,     sub:"Currently deployed" },
          { l:"Interest Earned",         v:fc(totalInterest,true),    c:T.goldLight, sub:"Accrued to date" },
          { l:"Total Returned",          v:fc(totalReturned,true),    c:T.green,     sub:"Principal + interest" },
        ].map(k => (
          <div key={k.l} style={{ background:T.navyMid, border:`1px solid ${T.border}`, borderRadius:10, padding:"14px 16px" }}>
            <div style={{ fontSize:9, color:T.textLight, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>{k.l}</div>
            <div style={{ fontSize:20, color:k.c, fontWeight:600, fontFamily:"'Garamond','Georgia',serif", marginBottom:2 }}>{k.v}</div>
            <div style={{ fontSize:10, color:T.textMid }}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Loan cards */}
      {INVESTOR.loans.map((loan, i) => {
        const isActive = loan.status === "Active";
        const accrualPct = loan.outstanding > 0 ? (loan.interest / loan.principal * 100).toFixed(2) : null;
        return (
          <div key={loan.id} style={{ background:T.navyMid, border:`1px solid ${isActive ? T.gold+"44" : T.border}`, borderRadius:14, overflow:"hidden" }}>
            {/* Loan header */}
            <div style={{ background: isActive ? `linear-gradient(90deg,${T.gold}14,${T.navyLight})` : T.navy, padding:"14px 20px", borderBottom:`1px solid ${isActive?T.gold+"33":T.border}`, display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
                  <span style={{ fontSize:10, color:T.textLight, fontFamily:"monospace", background:T.navyDeep||T.navy, border:`1px solid ${T.border}`, borderRadius:4, padding:"2px 7px" }}>{loan.id}</span>
                  <Badge label={loan.status}/>
                </div>
                <div style={{ color:T.text, fontSize:14, fontWeight:500, fontFamily:"'Garamond','Georgia',serif" }}>{loan.description}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:9, color:T.textLight, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:2 }}>Principal</div>
                <div style={{ fontSize:20, color: isActive ? T.amber : T.green, fontWeight:700, fontFamily:"'Garamond','Georgia',serif" }}>{fc(loan.principal,true)}</div>
              </div>
            </div>

            {/* Loan body */}
            <div style={{ padding:"16px 20px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:14, marginBottom:14 }}>
                {[
                  { l:"Interest Rate",     v:loan.rate,            c:T.goldLight },
                  { l:"Term",              v:loan.term,            c:T.text      },
                  { l:"Issued",            v:loan.issued,          c:T.textMid   },
                  { l:"Maturity",          v:loan.matured,         c:T.textMid   },
                  { l:"Outstanding",       v:fc(loan.outstanding), c:loan.outstanding>0?T.amber:T.green },
                  { l:"Interest Accrued",  v:fc(loan.interest),    c:T.goldLight },
                  ...(loan.returned>0?[{ l:"Total Returned", v:fc(loan.returned,true), c:T.green }]:[]),
                ].map(f => (
                  <div key={f.l} style={{ background:T.navy, borderRadius:7, padding:"10px 12px" }}>
                    <div style={{ fontSize:9, color:T.textLight, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:3 }}>{f.l}</div>
                    <div style={{ fontSize:13, color:f.c, fontWeight:600 }}>{f.v}</div>
                  </div>
                ))}
              </div>

              {/* Progress bar for active loans */}
              {isActive && (
                <div style={{ marginBottom:12 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                    <span style={{ fontSize:9, color:T.textLight, textTransform:"uppercase", letterSpacing:"0.08em" }}>Interest accrued vs principal</span>
                    <span style={{ fontSize:10, color:T.goldLight, fontWeight:600 }}>{accrualPct}%</span>
                  </div>
                  <div style={{ background:T.navy, borderRadius:999, height:5 }}>
                    <div style={{ background:`linear-gradient(90deg,${T.gold},${T.goldLight})`, width:`${Math.min(parseFloat(accrualPct)*3,100)}%`, height:5, borderRadius:999 }}/>
                  </div>
                </div>
              )}

              {/* Notes */}
              <div style={{ background:T.navy, border:`1px solid ${T.border}`, borderRadius:7, padding:"9px 12px", display:"flex", gap:8, alignItems:"flex-start" }}>
                <span style={{ color:T.gold, fontSize:12, marginTop:1 }}>◈</span>
                <span style={{ fontSize:11, color:T.textMid, lineHeight:1.6 }}>{loan.notes}</span>
              </div>
            </div>
          </div>
        );
      })}

      {/* Summary note */}
      <div style={{ background:T.navyMid, border:`1px solid ${T.gold}33`, borderRadius:10, padding:"14px 16px", display:"flex", gap:12 }}>
        <div style={{ color:T.gold, fontSize:18, marginTop:1 }}>◈</div>
        <div>
          <div style={{ color:T.gold, fontSize:11, fontWeight:600, marginBottom:4 }}>Loan Interest Policy</div>
          <div style={{ color:T.textMid, fontSize:11, lineHeight:1.7 }}>
            Private loans through Q Capital Partners earn interest at the agreed rate (typically 7.5–9.0% per annum) 
            from the date of funding. Interest is calculated daily and repaid with principal at loan maturity or 
            project milestone. All loan positions are secured by project assets and backed by Q Capital Partners' 
            LP structure. Statements are issued quarterly.
          </div>
        </div>
      </div>
    </div>
  );
};
